[package]
name = "godwinmix-playout"
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
description = "A playlist source for GodwinMix: many files played back to back as one source, with no gap between them"
license = "Apache-2.0"
authors = ["psmux"]
repository = "https://github.com/psmux/godwinmix-playout"
publish = false

[workspace]
members = [".", "launch"]

[lib]
name = "godwinmix_playout"
path = "src/lib.rs"

[[bin]]
name = "playout-engine"
path = "src/main.rs"

[dependencies]
# The protocol loop, the manifest and the Matroska writer for the container
# transport. Pinned to a release tag of the mixer it was built against.
godwinmix-sdk = { git = "https://github.com/psmux/GodwinMix", tag = "v0.3.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Video decode only, through the platform's own decoders. See README.md.
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-video = "0.24"
# Pure Rust from here down.
matroska-demuxer = "0.8"
symphonia = { version = "0.5", default-features = false, features = ["aac", "mp3", "flac", "vorbis", "pcm", "wav", "ogg", "isomp4", "aiff", "adpcm"] }
rubato = "0.16"
fast_image_resize = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
