name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: GStreamer (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gstreamer
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/install-gstreamer-windows.ps1
      - name: Build
        run: cargo build --release --locked --workspace
      - name: Unit tests and the offline transcript
        run: cargo test --release --locked --workspace
      - name: Clippy
        run: cargo clippy --release --locked --workspace -- -D warnings
