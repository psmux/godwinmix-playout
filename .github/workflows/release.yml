name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 rather than the newest, so the binaries run on a glibc as
          # old as 2.35: Ubuntu 22.04, Debian 12, Raspberry Pi OS bookworm.
          - { os: ubuntu-22.04, platform: linux-x86_64 }
          - { os: ubuntu-22.04-arm, platform: linux-aarch64 }
          - { os: macos-latest, platform: macos-aarch64 }
          - { os: macos-15-intel, platform: macos-x86_64 }
          - { os: windows-latest, platform: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag matches the manifest and the crate
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          manifest=$(sed -n 's/^version = "\(.*\)"/\1/p' gmx-plugin.toml | head -1)
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$want" != "$manifest" ] || [ "$want" != "$crate" ]; then
            echo "tag $GITHUB_REF_NAME says $want, gmx-plugin.toml says $manifest, Cargo.toml says $crate. Make them agree and tag again."
            exit 1
          fi
      - name: GStreamer (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The 22.04 image carries libunwind-14-dev, which conflicts with the
          # libunwind-dev that libgstreamer1.0-dev depends on.
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: GStreamer (Apple silicon)
        if: matrix.platform == 'macos-aarch64'
        run: |
          brew install gstreamer
          echo "PKG_CONFIG_PATH=$(brew --prefix gstreamer)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig" >> "$GITHUB_ENV"
      # Homebrew has dropped Intel Macs: GStreamer's own universal packages,
      # from the GodwinMix CI mirror first. See the script.
      - name: GStreamer (Intel Mac)
        if: matrix.platform == 'macos-x86_64'
        timeout-minutes: 30
        run: bash ci/install-gstreamer-macos.sh
      - name: GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/install-gstreamer-windows.ps1
      # Homebrew's GStreamer moves to a new Cellar folder with every update,
      # and a cached build still links against the old one, so the cache is
      # keyed on the versions installed.
      - name: Note the GStreamer version for the cache key
        shell: bash
        run: |
          if command -v brew >/dev/null; then stamp=$(brew list --versions gstreamer glib | tr ' 
' '__'); else stamp=fixed; fi
          echo "GST_STAMP=$stamp" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform || matrix.os }}-${{ env.GST_STAMP }}
      - name: Build
        run: cargo build --release --locked --workspace
      - name: Test
        run: cargo test --release --locked --workspace
      # The built engine, started the way the core starts it (through the
      # launcher on macOS and Linux), plays a VP8 and Vorbis file, a WAV and a
      # PNG made here, with no core: decode through the platform's GStreamer,
      # item changes, the protocol. libvpx is in every GStreamer this runs on.
      - name: Smoke test with no core
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then sudo apt-get install -y gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-tools; fi
          mkdir -p smoke
          gst-launch-1.0 -q -e videotestsrc num-buffers=60 ! video/x-raw,width=640,height=360,framerate=30/1 ! vp8enc deadline=1 ! webmmux name=m ! filesink location=smoke/a.webm audiotestsrc num-buffers=94 ! audio/x-raw,rate=48000,channels=2 ! audioconvert ! vorbisenc ! m.
          gst-launch-1.0 -q -e audiotestsrc num-buffers=47 ! audio/x-raw,rate=44100,channels=2 ! wavenc ! filesink location=smoke/b.wav
          gst-launch-1.0 -q videotestsrc num-buffers=1 ! video/x-raw,width=320,height=240 ! pngenc ! filesink location=smoke/c.png
          python3 dev/capture.py --engine target/release/playout --seconds 10 --size 640x360x30 --out smoke/out.mkv --check smoke/a.webm smoke/b.wav smoke/c.png
      - name: Package
        shell: bash
        run: bash dev/package.sh ${{ matrix.platform }} target/release dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Every archive holds the manifest at playout/
        run: |
          ls -la dist
          for f in dist/*.tar.gz; do tar -tzf "$f" | grep -qx 'playout/gmx-plugin.toml'; tar -tvzf "$f" playout/bin/playout | grep -q '^-rwx'; done
          for f in dist/*.zip; do unzip -l "$f" | grep -q 'playout/gmx-plugin.toml'; done
          [ "$(ls dist | wc -l)" = 5 ]
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes=$(awk -v v="## ${tag#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Playout ${tag#v}" --notes "$notes"
          fi
